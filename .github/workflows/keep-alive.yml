name: Keep Streamlit Awake
on:
  schedule:
    - cron: "14 */10 * * *"
  workflow_dispatch: # Allows you to run it manually if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -sL https://college-football-predictor.streamlit.app > /dev/null
